name: opentix-monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分鐘（GitHub 最短間隔，尖峰時可能延遲）
  workflow_dispatch:

concurrency:
  group: opentix-monitor
  cancel-in-progress: false

jobs:
  check:
    # 校正完成前不會自動執行；到 Settings → Secrets and variables → Actions → Variables
    # 新增 MONITOR_ENABLED = true 才會啟動
    if: ${{ vars.MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: opentix-state-${{ github.run_id }}
          restore-keys: opentix-state-

      - name: Check tickets
        run: python opentix_monitor.py --once
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION_USER_ID: ${{ secrets.DISCORD_MENTION_USER_ID }}
          RENOTIFY_MINUTES: "15"
          UNKNOWN_ALERT_AFTER: "6"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: opentix-state-${{ github.run_id }}
